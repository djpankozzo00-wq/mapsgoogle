<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071b3a" />
  <title>ProspecMap — Micro CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" defer></script>
  <style>body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.demo-gradient{background-image:radial-gradient(circle at top right,rgba(255,255,255,.16),transparent 32%),linear-gradient(135deg,var(--from),var(--to))}.float-wa{animation:pulse 2.4s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{box-shadow:0 0 0 12px rgba(34,197,94,0)}} </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-950">
  <div id="app"></div>
  <script>
    const KEY='prospecmap-leads-v2', API_KEY='prospecmap-hasdata-key';
    const statuses=['A contactar','Em negociação','Fechado','Rejeitado'];
    const examples=[
      {id:'demo-1',name:'Pizzaria Bella Napoli',niche:'Pizzaria',city:'Campinas',state:'SP',country:'Brasil',status:'A contactar',whatsapp:'5519998765432',notes:'Encontrada no Google Maps. Sem site próprio.'},
      {id:'demo-2',name:'Auto Center Horizonte',niche:'Oficina',city:'Belo Horizonte',state:'MG',country:'Brasil',status:'Em negociação',whatsapp:'5531987654321',notes:'Proprietário pediu contato na próxima semana.'},
      {id:'demo-3',name:'Studio Corte & Estilo',niche:'Salão de Beleza',city:'Curitiba',state:'PR',country:'Brasil',status:'Fechado',whatsapp:'5541987654321',notes:'Projeto aprovado. Aguardando briefing.'}
    ];
    let leads=JSON.parse(localStorage.getItem(KEY)||'null')||examples, search='', niche='Todos', status='Todos', demo=null, loading=false, message='';
    const cleanPhone=v=>String(v||'').replace(/\D/g,'');
    const save=()=>localStorage.setItem(KEY,JSON.stringify(leads));
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const nicheClass=n=>n.toLowerCase().includes('pizza')?'bg-orange-100 text-orange-700':n.toLowerCase().includes('oficina')||n.toLowerCase().includes('mecân')?'bg-slate-200 text-slate-700':n.toLowerCase().includes('salão')||n.toLowerCase().includes('beleza')?'bg-pink-100 text-pink-700':'bg-blue-100 text-blue-700';
    const statusClass=s=>({'A contactar':'bg-amber-100 text-amber-700','Em negociação':'bg-blue-100 text-blue-700','Fechado':'bg-emerald-100 text-emerald-700','Rejeitado':'bg-slate-200 text-slate-600'}[s]||'bg-slate-100 text-slate-600');
    function render(){ demo?renderDemo():renderPanel(); }
    function renderPanel(){
      const niches=['Todos',...new Set(leads.map(l=>l.niche))]; const filtered=leads.filter(l=>`${l.name} ${l.city} ${l.state} ${l.niche}`.toLowerCase().includes(search.toLowerCase())&&(niche==='Todos'||l.niche===niche)&&(status==='Todos'||l.status===status));
      document.getElementById('app').innerHTML=`<header class="sticky top-0 z-20 bg-[#071b3a] text-white shadow-lg"><div class="mx-auto max-w-6xl px-4 py-4"><div class="flex items-center justify-between gap-3"><div><div class="flex items-center gap-2"><span class="grid size-9 place-items-center rounded-xl bg-cyan-400 text-[#071b3a]"><i class="fa-solid fa-location-dot"></i></span><h1 class="text-lg font-extrabold">ProspecMap</h1></div><p class="mt-1 text-xs text-blue-200">${leads.length} leads salvos no aparelho</p></div><button id="newLead" class="rounded-xl bg-white px-3 py-2.5 text-sm font-bold text-[#071b3a] shadow hover:bg-cyan-50"><i class="fa-solid fa-plus mr-1"></i>Novo Lead</button></div><div class="mt-5 rounded-xl border border-white/10 bg-white/10 p-3"><label class="mb-1 block text-[11px] font-bold uppercase tracking-wider text-cyan-200">API Key HasData</label><input id="apiKey" type="password" value="${esc(localStorage.getItem(API_KEY)||'')}" placeholder="Cole sua chave para buscar no Google Maps" class="w-full bg-transparent text-sm outline-none placeholder:text-blue-200/60" /></div></div></header><main class="mx-auto max-w-6xl px-4 pb-12 pt-5"><section class="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm"><div class="flex gap-2"><input id="search" value="${esc(search)}" placeholder="Buscar novos alvos (ex: Oficinas em Salvador)" class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none focus:border-cyan-500" /><button id="searchBtn" class="shrink-0 rounded-xl bg-cyan-600 px-4 py-3 text-sm font-bold text-white hover:bg-cyan-700" ${loading?'disabled':''}><i class="fa-solid ${loading?'fa-spinner fa-spin':'fa-magnifying-glass'}"></i><span class="hidden sm:inline"> Buscar</span></button></div><div class="mt-3 grid grid-cols-2 gap-2"><select id="niche" class="rounded-lg border border-slate-200 px-2 py-2 text-xs font-semibold"><option>Todos</option>${niches.slice(1).map(n=>`<option ${n===niche?'selected':''}>${esc(n)}</option>`).join('')}</select><select id="status" class="rounded-lg border border-slate-200 px-2 py-2 text-xs font-semibold"><option>Todos</option>${statuses.map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select></div>${message?`<p class="mt-3 rounded-lg bg-cyan-50 px-3 py-2 text-xs font-semibold text-cyan-800">${esc(message)}</p>`:''}</section><div class="mb-4 mt-7"><p class="text-sm font-semibold text-slate-500">Carteira de prospecção</p><h2 class="text-xl font-extrabold">${filtered.length} ${filtered.length===1?'lead encontrado':'leads encontrados'}</h2></div><section class="grid gap-4 md:grid-cols-2">${filtered.length?filtered.map(card).join(''):`<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center md:col-span-2"><i class="fa-solid fa-building-circle-xmark text-3xl text-slate-300"></i><p class="mt-3 font-bold text-slate-700">Nenhum lead encontrado</p></div>`}</section></main>`;
      document.getElementById('newLead').onclick=()=>openForm(); document.getElementById('search').oninput=e=>{search=e.target.value;render()}; document.getElementById('niche').onchange=e=>{niche=e.target.value;render()}; document.getElementById('status').onchange=e=>{status=e.target.value;render()}; document.getElementById('searchBtn').onclick=searchMaps; document.getElementById('apiKey').onchange=e=>localStorage.setItem(API_KEY,e.target.value.trim());
    }
    function card(l){return `<article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><h3 class="truncate text-base font-extrabold">${esc(l.name)}</h3><span class="mt-2 inline-block rounded-full px-2.5 py-1 text-[11px] font-bold ${nicheClass(l.niche)}">${esc(l.niche)}</span></div><span class="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-bold ${statusClass(l.status)}">${l.status}</span></div><p class="mt-4 text-sm text-slate-600"><i class="fa-solid fa-location-dot mr-2 text-cyan-600"></i>${esc(l.city)}, ${esc(l.state)} · ${esc(l.country||'Brasil')}</p>${l.notes?`<p class="mt-3 rounded-xl bg-slate-50 p-3 text-sm leading-5 text-slate-600"><i class="fa-solid fa-note-sticky mr-2 text-slate-400"></i>${esc(l.notes)}</p>`:''}<div class="mt-5 grid grid-cols-2 gap-2"><a target="_blank" rel="noreferrer" href="https://wa.me/${cleanPhone(l.whatsapp)}" class="rounded-xl bg-[#16a05d] px-3 py-3 text-center text-sm font-bold text-white"><i class="fa-brands fa-whatsapp mr-1"></i>WhatsApp</a><button onclick="showDemo('${l.id}')" class="rounded-xl bg-[#071b3a] px-3 py-3 text-sm font-bold text-white"><i class="fa-solid fa-wand-magic-sparkles mr-1 text-cyan-300"></i>Ver Site Demo</button></div><div class="mt-3 flex gap-2"><select onchange="changeStatus('${l.id}',this.value)" class="min-w-0 flex-1 rounded-lg border border-slate-200 px-2 py-2 text-xs font-semibold">${statuses.map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('')}</select><button onclick="editLead('${l.id}')" class="rounded-lg border border-slate-200 px-3 text-slate-600" title="Editar"><i class="fa-solid fa-pen"></i></button><button onclick="deleteLead('${l.id}')" class="rounded-lg border border-red-100 px-3 text-red-500" title="Excluir"><i class="fa-solid fa-trash"></i></button></div></article>`}
    function openForm(lead){const l=lead||{}; document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="fixed inset-0 z-50 flex items-end justify-center bg-[#071b3a]/60 p-0 backdrop-blur-sm sm:items-center sm:p-4"><form id="leadForm" class="max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl sm:rounded-3xl"><div class="mb-5 flex items-center justify-between"><div><p class="text-sm font-bold text-cyan-700">${lead?'Editar lead':'Novo cadastro'}</p><h2 class="text-2xl font-extrabold">${lead?'Atualizar lead':'Adicionar empresa'}</h2></div><button type="button" id="closeModal" class="rounded-full p-2 text-slate-400"><i class="fa-solid fa-xmark"></i></button></div><div class="grid gap-3 sm:grid-cols-2"><input name="name" required value="${esc(l.name)}" placeholder="Nome da empresa" class="rounded-xl border border-slate-200 px-3 py-3 sm:col-span-2" /><input name="niche" required value="${esc(l.niche)}" placeholder="Nicho (ex: Pizzaria)" class="rounded-xl border border-slate-200 px-3 py-3" /><input name="city" required value="${esc(l.city)}" placeholder="Cidade" class="rounded-xl border border-slate-200 px-3 py-3" /><input name="state" required maxlength="2" value="${esc(l.state)}" placeholder="Estado (UF)" class="rounded-xl border border-slate-200 px-3 py-3 uppercase" /><input name="country" value="${esc(l.country||'Brasil')}" placeholder="País" class="rounded-xl border border-slate-200 px-3 py-3" /><input name="whatsapp" required inputmode="tel" value="${esc(l.whatsapp)}" placeholder="WhatsApp com DDD" class="rounded-xl border border-slate-200 px-3 py-3 sm:col-span-2" /><select name="status" class="rounded-xl border border-slate-200 px-3 py-3 sm:col-span-2">${statuses.map(s=>`<option ${s===(l.status||'A contactar')?'selected':''}>${s}</option>`).join('')}</select><textarea name="notes" rows="3" placeholder="Notas rápidas" class="rounded-xl border border-slate-200 px-3 py-3 sm:col-span-2">${esc(l.notes)}</textarea></div><button class="mt-5 w-full rounded-xl bg-[#071b3a] px-4 py-3 font-bold text-white">Salvar lead</button></form></div>`);document.getElementById('closeModal').onclick=()=>document.getElementById('modal').remove();document.getElementById('leadForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data={name:f.get('name').trim(),niche:f.get('niche').trim(),city:f.get('city').trim(),state:f.get('state').trim().toUpperCase(),country:f.get('country').trim()||'Brasil',whatsapp:cleanPhone(f.get('whatsapp')),status:f.get('status'),notes:f.get('notes').trim()};lead?leads=leads.map(x=>x.id===lead.id?{...x,...data}:x):leads=[{id:crypto.randomUUID(),...data},...leads];save();document.getElementById('modal').remove();render()};}
    window.showDemo=id=>{demo=leads.find(l=>l.id===id);render()}; window.changeStatus=(id,v)=>{leads=leads.map(l=>l.id===id?{...l,status:v}:l);save();render()}; window.editLead=id=>openForm(leads.find(l=>l.id===id)); window.deleteLead=id=>{if(confirm('Excluir este lead?')){leads=leads.filter(l=>l.id!==id);save();render()}};
    function renderDemo(){const l=demo,n=l.niche.toLowerCase(),pizza=n.includes('pizza'),oficina=n.includes('oficina')||n.includes('mecân'),beauty=n.includes('salão')||n.includes('beleza')||n.includes('estética');const t=pizza?{from:'#7f1d1d',to:'#ea580c',eyebrow:'Sabor que chega até você',title:'A melhor experiência em cada pedaço.',desc:`Receitas artesanais, ingredientes selecionados e muito sabor em ${esc(l.city)}.`}:oficina?{from:'#0f172a',to:'#1e3a8a',eyebrow:'Confiança para seguir em frente',title:'Seu carro em boas mãos.',desc:'Agilidade, transparência e cuidado para você dirigir tranquilo em ${esc(l.city)}.'}:beauty?{from:'#701a75',to:'#db2777',eyebrow:'Seu momento começa aqui',title:'Realce a sua melhor versão.',desc:'Um espaço pensado para cuidar de você com carinho, técnica e estilo.'}:{from:'#0f2d5c',to:'#0891b2',eyebrow:'Excelência local',title:'Uma experiência feita para você.',desc:'Qualidade, atenção e praticidade para clientes de ${esc(l.city)}.'};const wa='https://wa.me/'+cleanPhone(l.whatsapp)+'?text='+encodeURIComponent('Olá! Vi o site de vocês e gostaria de fazer um pedido/agendamento.');document.getElementById('app').innerHTML=`<main class="min-h-screen text-white" style="--from:${t.from};--to:${t.to}"><div class="mx-auto max-w-6xl px-4 py-4"><button onclick="demo=null;render()" class="rounded-full border border-white/25 px-4 py-2 text-sm font-semibold hover:bg-white/10"><i class="fa-solid fa-arrow-left mr-2"></i>Voltar para o Painel</button></div><section class="demo-gradient"><div class="mx-auto max-w-6xl px-5 py-20 sm:py-28"><p class="text-sm font-bold uppercase tracking-[.2em] text-white/75">${t.eyebrow}</p><h1 class="mt-5 max-w-2xl text-4xl font-black leading-tight sm:text-6xl">${esc(l.name)}<br><span class="text-white/80">${t.title}</span></h1><p class="mt-6 max-w-xl text-lg leading-8 text-white/80">${t.desc}</p><a href="${wa}" target="_blank" rel="noreferrer" class="mt-8 inline-flex rounded-2xl bg-white px-6 py-4 font-extrabold text-slate-900 shadow-xl"><i class="fa-brands fa-whatsapp mr-2 text-emerald-600"></i>Fale com a gente</a></div></section><section class="mx-auto max-w-6xl px-5 py-12 sm:py-20"><p class="text-sm font-bold uppercase tracking-widest text-white/60">Por que escolher ${esc(l.name)}</p><div class="mt-6 grid gap-4 sm:grid-cols-3"><div class="rounded-2xl border border-white/10 bg-white/10 p-5"><i class="fa-solid fa-star text-2xl text-yellow-300"></i><h2 class="mt-4 font-bold">Qualidade de verdade</h2><p class="mt-2 text-sm leading-6 text-white/65">Cada detalhe recebe atenção para entregar uma experiência memorável.</p></div><div class="rounded-2xl border border-white/10 bg-white/10 p-5"><i class="fa-solid fa-bolt text-2xl text-cyan-300"></i><h2 class="mt-4 font-bold">Agilidade local</h2><p class="mt-2 text-sm leading-6 text-white/65">Atendimento próximo, rápido e pensado para a rotina de ${esc(l.city)}.</p></div><div class="rounded-2xl border border-white/10 bg-white/10 p-5"><i class="fa-solid fa-heart text-2xl text-pink-300"></i><h2 class="mt-4 font-bold">Feito com carinho</h2><p class="mt-2 text-sm leading-6 text-white/65">Um serviço que combina cuidado, confiança e paixão pelo que fazemos.</p></div></div></section><a href="${wa}" target="_blank" rel="noreferrer" class="float-wa fixed bottom-5 right-5 grid size-14 place-items-center rounded-full bg-[#16a05d] text-2xl text-white shadow-2xl" aria-label="Chamar no WhatsApp"><i class="fa-brands fa-whatsapp"></i></a></main>`}
    async function searchMaps(){const q=document.getElementById('search').value.trim();const key=document.getElementById('apiKey').value.trim();if(!q||!key){message='Informe a busca e sua API Key HasData.';render();return}localStorage.setItem(API_KEY,key);loading=true;message='Buscando empresas sem site...';render();try{const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,apiKey:key})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Falha na busca');const incoming=(data.leads||[]).map(x=>({...x,id:crypto.randomUUID(),status:'A contactar',country:x.country||'Brasil',whatsapp:cleanPhone(x.whatsapp||x.phone),notes:'Encontrada no Google Maps sem site.'}));leads=[...incoming,...leads];save();message=`${incoming.length} empresas sem site adicionadas.`}catch(e){message=e.message||'Não foi possível realizar a busca.'}finally{loading=false;render()}}
    render();
  </script>
</body>
</html>
